site_name: Localizaciones Odoo 19
site_description: Manuales de las localizaciones Uruguay (CFE/DGI) y Paraguay (SIFEN/DNIT)
site_author: Proyectasoft

repo_name: localization-docs
repo_url: https://github.com/Pabloolano/localization-docs
edit_uri: edit/main/docs/

copyright: Proyectasoft — localizaciones genéricas, sin datos de clientes

theme:
  name: material
  language: es
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Modo claro
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.action.edit
    - toc.follow

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang: es

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Inicio: index.md
  - Uruguay:
      - uruguay/index.md
      - Configuración: uruguay/configuracion.md
      - Cuentas e impuestos: uruguay/cuentas.md
      - Uso: uruguay/uso.md
      - Conciliación DGI: uruguay/conciliacion.md
      - Reportes DGI: uruguay/reportes.md
      - Diferencia de cambio: uruguay/diferencia-cambio.md
  - Paraguay:
      - paraguay/index.md
      - Configuración: paraguay/configuracion.md
      - Cuentas e impuestos: paraguay/cuentas.md
      - Uso: paraguay/uso.md
      - Compras: paraguay/compras.md
      - Reportes DNIT: paraguay/reportes.md
      - Tipo de cambio: paraguay/tipo-cambio.md
  - Común:
      - comun/index.md
      - Analítica: comun/analitica.md
      - Empresa: comun/empresa.md
      - Captcha: comun/captcha.md
      - Pagos: comun/pagos.md
      - Estado de cuenta: comun/estado-cuenta.md
      - Segunda moneda: comun/multimoneda.md
  - COMEX:
      - comex/index.md
      - Carpetas: comex/carpetas.md
      - Cotizador: comex/cotizador.md
