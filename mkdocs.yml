site_name: Localizaciones Odoo 19
site_description: Manuales de las localizaciones Uruguay (CFE/DGI) y Paraguay (SIFEN/DNIT)
site_author: Proyectasoft

repo_name: localization-docs
repo_url: https://github.com/Pabloolano/localization-docs
edit_uri: edit/main/docs/

copyright: Proyectasoft — localizaciones genéricas, sin datos de clientes

theme:
  name: material
  language: es
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.action.edit
    - toc.follow
    - toc.integrate

plugins:
  - search:
      lang: es

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Inicio: index.md
  - Uruguay:
      - uruguay/index.md
      - Configuración: uruguay/configuracion.md
      - Uso: uruguay/uso.md
  - Paraguay:
      - paraguay/index.md
      - Configuración: paraguay/configuracion.md
      - Uso: paraguay/uso.md
